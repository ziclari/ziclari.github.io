<aside class="sidebar" [class.closed]="!isOpen()">
  <button class="toggle-btn" (click)="toggleSidebar()">
    {{ isOpen() ? 'Close' : 'Open' }} Sidebar
  </button>
  @if (isOpen()) {
    <nav>
        <ul>
        @for(item of items; track item){
            <li>
                <a href="#" class="sidebar-link">{{ item }}</a>
            </li>
        }
        </ul>
    </nav>
  }
</aside>
